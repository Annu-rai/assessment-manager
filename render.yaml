# Render Blueprint for the backend API.
# In the Render dashboard: New + → Blueprint → connect this repo.
# Render reads this file and creates the web service automatically.
services:
  - type: web
    name: assessment-api
    runtime: node
    rootDir: server
    plan: free
    # --omit=dev skips test-only deps (mongodb-memory-server downloads a large
    # binary we don't need in production) for a faster, more reliable build.
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Auto-generated strong secret for signing JWTs.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      # Set these in the dashboard after creating the service:
      #   MONGO_URI        → your MongoDB Atlas connection string (required)
      #   CLIENT_ORIGIN    → your deployed Vercel frontend URL (for CORS + links)
      #   ANTHROPIC_API_KEY→ optional; enables AI features (generator/eval/insights/chat)
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # NOTE: file uploads use local disk, which is ephemeral on Render's free
      # plan (wiped on redeploy/restart). Swap to S3/Cloudinary for durable files.
